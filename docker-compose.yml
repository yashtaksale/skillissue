services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillissue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillissue}
      POSTGRES_DB: skillissue
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillissue"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5



  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://skillissue:${POSTGRES_PASSWORD:-skillissue}@postgres:5432/skillissue
      - REDIS_URL=redis://redis:6379/0
      - LLM_MODE=fake
      - SITE_URL=${SITE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "skillissue.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://skillissue:${POSTGRES_PASSWORD:-skillissue}@postgres:5432/skillissue
      - REDIS_URL=redis://redis:6379/0
      - LLM_MODE=fake
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["rq", "worker", "scans", "--url", "redis://redis:6379/0"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
